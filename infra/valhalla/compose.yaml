services:
  valhalla:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: veladrive-valhalla
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      tile_urls: "https://download.geofabrik.de/asia/thailand-latest.osm.pbf"
      server_threads: "2"
      use_tiles_ignore_pbf: "True"
      force_rebuild: "${VALHALLA_FORCE_REBUILD:-False}"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
    volumes:
      - ./data:/custom_files
