name: Thailand POI Dataset

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/thailand-poi-pipeline-*"
    paths:
      - ".github/workflows/thailand-poi-dataset.yml"
      - "tools/osm_poi_importer/**"

jobs:
  build-thailand-pois:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OSM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install --upgrade pip
          python -m pip install osmium shapely

      - name: Download Thailand OpenStreetMap extract
        run: |
          mkdir -p build/thailand-poi
          curl --fail --location --retry 3 \
            https://download.geofabrik.de/asia/thailand-latest.osm.pbf \
            --output build/thailand-poi/thailand-latest.osm.pbf

      - name: Fetch Thailand administrative boundary
        run: |
          python -m tools.osm_poi_importer.fetch_boundary \
            --query "Thailand" \
            --osm-relation-id 2067731 \
            --output build/thailand-poi/thailand-boundary.geojson

      - name: Filter mapped POI tags
        run: |
          osmium tags-filter \
            build/thailand-poi/thailand-latest.osm.pbf \
            nwr/amenity=fuel nwr/amenity=hospital \
            nwr/amenity=restaurant nwr/amenity=fast_food nwr/amenity=food_court nwr/amenity=cafe \
            nwr/amenity=marketplace nwr/amenity=police nwr/amenity=bus_station \
            nwr/amenity=bank nwr/amenity=atm nwr/amenity=charging_station \
            nwr/amenity=ferry_terminal nwr/amenity=place_of_worship \
            nwr/amenity=townhall nwr/amenity=courthouse \
            nwr/healthcare=hospital \
            nwr/tourism=hotel nwr/tourism=hostel nwr/tourism=guest_house nwr/tourism=motel \
            nwr/tourism=resort nwr/tourism=chalet nwr/tourism=attraction \
            nwr/tourism=aquarium nwr/tourism=artwork nwr/tourism=gallery \
            nwr/tourism=museum nwr/tourism=theme_park nwr/tourism=viewpoint nwr/tourism=zoo \
            nwr/shop=mall nwr/shop=department_store nwr/shop=convenience \
            nwr/shop=car_repair nwr/shop=tyres nwr/craft=car_repair \
            nwr/aeroway=aerodrome nwr/aeroway=terminal nwr/man_made=pier \
            nwr/office=government \
            --overwrite \
            -o build/thailand-poi/thailand-pois-filtered.osm.pbf

      - name: Generate Vela Thailand POI dataset
        run: |
          SNAPSHOT_DATE="$(date -u +%F)"
          python -m tools.osm_poi_importer.cli \
            --input build/thailand-poi/thailand-pois-filtered.osm.pbf \
            --boundary build/thailand-poi/thailand-boundary.geojson \
            --snapshot-date "$SNAPSHOT_DATE" \
            --source-url "https://download.geofabrik.de/asia/thailand.html" \
            --boundary-name "Thailand" \
            --boundary-reference "relation/2067731" \
            --dataset-scope "thailand" \
            --skip-boundary-filter \
            --output build/thailand-poi/vela_pois_thailand.json \
            --report build/thailand-poi/import_report.json \
            --quarantine build/thailand-poi/quarantine.json

      - name: Extract province boundaries
        run: |
          osmium tags-filter \
            build/thailand-poi/thailand-latest.osm.pbf \
            r/admin_level=4 \
            --overwrite \
            -o build/thailand-poi/thailand-provinces.osm.pbf
          osmium export \
            build/thailand-poi/thailand-provinces.osm.pbf \
            --overwrite \
            -f geojson \
            -o build/thailand-poi/thailand-provinces.geojson

      - name: Split POIs into 77 province shards
        run: |
          mkdir -p build/thailand-poi/poi_provinces
          python -m tools.osm_poi_importer.shard_by_province \
            --dataset build/thailand-poi/vela_pois_thailand.json \
            --provinces build/thailand-poi/thailand-provinces.geojson \
            --output-dir build/thailand-poi/poi_provinces \
            --index build/thailand-poi/provinces.json \
            --report build/thailand-poi/province_shard_report.json \
            --overlay-dataset app/src/main/assets/vela_pois.json \
            --expected-provinces 77

      - name: Summarize dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/thailand-poi")
          data = json.loads((root / "vela_pois_thailand.json").read_text(encoding="utf-8"))
          report = json.loads((root / "import_report.json").read_text(encoding="utf-8"))
          size = (root / "vela_pois_thailand.json").stat().st_size
          print("POIs:", len(data["pois"]))
          print("JSON bytes:", size)
          print("Categories:", json.dumps(report["categoryCounts"], ensure_ascii=False, sort_keys=True))
          shard_report = json.loads((root / "province_shard_report.json").read_text(encoding="utf-8"))
          print("Province shards:", shard_report["provinceCount"])
          print("Province written POIs:", shard_report["writtenPois"])
          print("Curated overlay POIs:", shard_report.get("overlayPois", 0))
          print("Province unmatched POIs:", shard_report["unmatchedPois"])
          print("Largest provinces:", json.dumps(shard_report["largestProvinces"], ensure_ascii=False))
          PY

      - name: Install province shards into Android assets
        run: |
          rm -rf app/src/main/assets/poi_provinces
          mkdir -p app/src/main/assets/poi_provinces
          cp build/thailand-poi/provinces.json app/src/main/assets/poi_provinces/provinces.json
          cp build/thailand-poi/poi_provinces/*.json app/src/main/assets/poi_provinces/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Thailand POI debug APK
        run: |
          gradle --no-daemon :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Thailand POI APK
        uses: actions/upload-artifact@v4
        with:
          name: VelaDrive-thailand-poi-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Thailand POI review artifact
        uses: actions/upload-artifact@v4
        with:
          name: VelaDrive-thailand-poi-review
          path: |
            build/thailand-poi/vela_pois_thailand.json
            build/thailand-poi/import_report.json
            build/thailand-poi/quarantine.json
            build/thailand-poi/provinces.json
            build/thailand-poi/province_shard_report.json
            build/thailand-poi/poi_provinces/*.json
          retention-days: 14
          if-no-files-found: error
