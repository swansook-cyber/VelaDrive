name: Android CI

on:
  push:
    branches:
      - main
      - "spike/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LONGDO_MAP_API_KEY: ${{ secrets.LONGDO_MAP_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Validate lane audit tool
        run: python3 tools/lane_audit.py --self-test

      - name: Validate route smoke tool
        run: python3 tools/route_smoke_test.py --self-test

      - name: Install latest Thailand province POI assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list             --repo "$GITHUB_REPOSITORY"             --workflow "Thailand POI Dataset"             --status success             --limit 1             --json databaseId             --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          rm -rf build/thailand-poi-review app/src/main/assets/poi_provinces
          mkdir -p build/thailand-poi-review app/src/main/assets/poi_provinces
          gh run download "$RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "VelaDrive-thailand-poi-review"             --dir build/thailand-poi-review
          cp build/thailand-poi-review/build/thailand-poi/provinces.json             app/src/main/assets/poi_provinces/provinces.json
          cp build/thailand-poi-review/build/thailand-poi/poi_provinces/*.json             app/src/main/assets/poi_provinces/
          test "$(find app/src/main/assets/poi_provinces -maxdepth 1 -name '*.json' | wc -l)" -eq 78

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run lint
        run: gradle --no-daemon :app:lintDebug

      - name: Upload Vela Drive test APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: VelaDrive-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
